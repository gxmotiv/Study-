name: Temporary Actions workflow lint test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Download current Android workflow and actionlint
        run: |
          mkdir -p workflow-check
          curl -fsSL https://raw.githubusercontent.com/gxmotiv/Study-/main/.github/workflows/android-32bit.yml -o workflow-check/android-32bit.yml
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Validate Android workflow
        run: ./actionlint -color workflow-check/android-32bit.yml
