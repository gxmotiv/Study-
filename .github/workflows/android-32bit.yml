name: Build Android 32-bit APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/study-centre-android-32bit]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/android-32bit.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare web assets and create Android project
        run: |
          npm run prepare:web
          npx cap add android
          npx cap sync android
      - name: Restrict APK to 32-bit ARM
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "defaultConfig {"
          if marker not in s:
              raise SystemExit("Could not find defaultConfig in generated Android Gradle file")
          s = s.replace(marker, marker + '\n        ndk { abiFilters "armeabi-v7a" }', 1)
          p.write_text(s)
          print("Configured ABI: armeabi-v7a")
          PY
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nios-economics-study-centre-arm32-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
